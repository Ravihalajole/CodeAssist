name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    # `contents: write` is required so tagged pushes can attach the APK to a
    # GitHub Release via action-gh-release (see final step).
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caches Gradle distributions + compiled dependencies across runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # compileSdk is 36; the runner's preinstalled SDK may not include it,
      # so install the exact platform + command-line tools we need.
      - name: Set up Android SDK (API 36)
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          cmdline-tools-version: latest

      # The repo's local.properties is machine-specific (and not tracked);
      # generate one that points at the CI SDK so AGP never reads a stale stub.
      - name: Write local.properties for CI SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeassist-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true